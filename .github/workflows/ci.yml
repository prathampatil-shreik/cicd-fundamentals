name: CI Pipeline

on:
  push:
    branches: [ main ]

env:
  ECR_REGISTRY: 925213028316.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: cicd-fundamentals

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the code from GitHub
      - name: Checkout code
        uses: actions/checkout@v5

      # Step 2: Set up Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Run tests — pipeline fails here if any test fails
      - name: Run tests
        run: mvn test
        working-directory: app

      # Step 4: Build the JAR
      - name: Build JAR
        run: mvn clean package -DskipTests
        working-directory: app

      # Step 5: Authenticate to AWS using secrets stored in GitHub
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 6: Log in to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Step 7: Build and push Docker image with two tags: latest + commit SHA
      - name: Build and push Docker image to ECR
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
